name: "📝 Docs or chore"
description: Propose a README or reference update, a snapshot refresh, a pin bump or other maintenance
title: "[Docs/Chore]"
labels: ["needs-triage"]
body:
  - type: checkboxes
    id: existing-search
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for this change.
      options:
        - label: I have searched the existing issues
          required: true
  - type: dropdown
    id: change-type
    attributes:
      label: Type of change
      options:
        - Documentation (README, CONTRIBUTING, eval/README.md, clients/)
        - Reference snapshot refresh (references/ regenerated for a new KubeVela tag)
        - Server pin or check date (kubevela-sre/references/servers.yaml)
        - CI, validator or repository plumbing
        - Other chore / maintenance
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Name the files or areas affected and describe the update. For a snapshot refresh, name the KubeVela tag to regenerate from.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this needed?
      description: A clear and concise description of what is wrong, stale or missing today.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context here.
