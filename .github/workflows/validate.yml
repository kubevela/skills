name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validator self-tests
        run: bash tests/validator/test.sh
      - name: Validate skills and server table
        run: python3 scripts/validate_skills.py
      - name: Consumer inventory tests
        run: bash tests/consumers/test.sh
      - name: Shell syntax
        run: |
          for script in kubevela-platform-engineer/scripts/definition-consumers.sh tests/consumers/test.sh tests/validator/test.sh scripts/commit-message-lint.sh; do
            bash -n "$script"
          done
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit-message-lint (PR range)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" 2>/dev/null || true
          for sha in $(git rev-list "$BASE_SHA..HEAD"); do
            ./scripts/commit-message-lint.sh "$sha"
          done
